<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191815">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/app.css?v=3">
</head>
<body>
  <main class="login">
    <h1>Свои дома?</h1>
    {% if error %}<p class="error">Пароль не тот. Попробуй ещё раз.</p>{% endif %}
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Пароль" autofocus autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
